# Watches HDB's published rate schedule for changes.
#
# WHY THIS EXISTS: there is no parking-rate dataset on data.gov.sg - every
# dataset was checked. The rates in src/rates.js are transcribed from a web
# page, and transcribed numbers rot silently: a rate rises, a carpark joins the
# peak-hour list, and the app keeps confidently quoting last year's price to
# someone deciding where to park. This job is the alarm.
#
# It never edits the rates. A rate change deserves a human reading the page.

name: Check HDB rates

# NOT SCHEDULED, on purpose. HDB answers this runner "403 Error - Forbidden"
# whether the browser is headless or windowed under xvfb, so from here the check
# can only ever report that it could not look. A monthly job that always says
# "could not check" is noise, and noise is how the last two silent failures in
# this repo stayed invisible for days.
#
# The real check runs on KC's laptop, where a windowed browser gets the page:
# scheduled task "Carpark rate check", monthly. This workflow stays for running
# it by hand, and as the place the logic lives if HDB ever opens up.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install a browser
        # HDB returns 403 to plain HTTP clients and renders the page with
        # JavaScript, so reading it needs a real browser.
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Compare the published rates with the pinned ones
        # xvfb gives the runner a display, so the browser can open a real window.
        # HDB answers a headless browser with 403 and a windowed one with the
        # page - so on a headless runner there is no window to open without one.
        run: |
          set +e
          xvfb-run --auto-servernum node scripts/check-rates.js
          code=$?
          set -e
          # 1 = the rates actually changed, which must fail loudly.
          # 2 = the site was unreachable, which is not a rate change and must
          #     not cry wolf every time HDB has a bad morning.
          if [ "$code" = "2" ]; then
            echo "::warning::Could not reach HDB's rate page. Not treating that as a rate change."
            exit 0
          fi
          exit $code

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="description" content="What parking costs near any place in Singapore, hour by hour.
Find the cheapest time to arrive, not just the nearest carpark. HDB and URA rates, live lot counts.">
<title>Carpark SG — when parking near you is cheapest</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #14181f; --muted: #5c6672; --line: #e3e7ec;
    --ok: #17794a; --warn: #9a6200; --bad: #b3261e; --accent: #14181f;
    --scrim: rgb(0 0 0 / 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --card: #171d24; --ink: #e8edf2; --muted: #94a1ae; --line: #262f39;
      --ok: #4ac48a; --warn: #e0a33a; --bad: #ef6b62; --accent: #e8edf2;
      --scrim: rgb(0 0 0 / 0.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- shell -------------------------------------------------------- */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #map { flex: 1 1 auto; min-height: 0; background: var(--line); z-index: 0; }
  .leaflet-container { background: var(--line); font: inherit; }

  /* Layout A: the map fills the screen and the sheet floats over it.
     Layout B: the map takes the top of the screen and the sheet sits under it.
     Everything else about the two is identical, which is why this is one data
     attribute and not two code paths. */
  #app[data-layout="a"] #map { position: absolute; inset: 0; }
  #app[data-layout="a"] #sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--sheet-h, 46%); box-shadow: 0 -6px 24px var(--scrim);
    border-radius: 16px 16px 0 0;
  }
  #app[data-layout="b"] #map { flex: 0 0 42%; }
  #app[data-layout="b"] #sheet { flex: 1 1 auto; min-height: 0; border-top: 1px solid var(--line); }
  #app[data-layout="b"] #grip { display: none; }

  #sheet {
    background: var(--card); z-index: 500; display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #grip { flex: 0 0 auto; padding: 9px 0 5px; cursor: grab; touch-action: none; }
  #grip:active { cursor: grabbing; }
  #grip i { display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
  #sheetHead { flex: 0 0 auto; padding: 4px 14px 8px; display: flex; flex-direction: column; gap: 7px; }
  #sheetBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 14px 24px; -webkit-overflow-scrolling: touch; }

  /* ---- controls ----------------------------------------------------- */
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; padding: 10px 14px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

  .bar-row { display: flex; gap: 7px; align-items: center; }
  #q {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .icon-btn { flex: 0 0 auto; padding: 10px 13px; line-height: 1; }


  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  /* Sorting and filtering are different questions - ONE order, ANY number of
     types - and nine identical pills wrapping into three rows said neither.
     A joined segmented control reads as "pick one"; separate outlined toggles
     read as "pick any"; a label on each row says which is which. */
  .ctl-row { display: flex; align-items: center; gap: 9px; }
  .ctl-lab {
    flex: 0 0 auto; width: 38px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
  }
  .seg {
    display: flex; flex: 1 1 auto; min-width: 0; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px;
  }
  .seg button {
    flex: 1 1 0; min-width: 0; font-size: 13px; font-weight: 600; padding: 6px 4px;
    border: none; border-radius: 8px; background: none; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px var(--scrim); }
  /* Wrapping is right in the rail, where there is room for two lines. On a
     phone it cost 33px of a sheet that had none to spare, so there the filters
     scroll sideways the way phone filter rows always have. The desktop rule
     below is more specific and turns wrapping back on. */
  #typeChips { flex: 1 1 auto; min-width: 0; }

  /* ---- when to go ---------------------------------------------------- */
  /* The front page of this app is a question about TIME, not a list of
     carparks: parking near here is free after 5pm, and no amount of sorting a
     list by distance will tell you that. */
  .when-panel {
    border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px 12px;
    margin: 10px 0 4px; background: var(--card);
  }
  .verdict { font-size: 20px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
  .verdict .big { font-size: 26px; }
  .verdict em { font-style: normal; color: var(--ok); }
  .verdict-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .verdict-sub b { color: var(--ink); font-weight: 600; }
  .save { color: var(--ok); font-weight: 700; }
  /* On a phone the panel has to fit the verdict AND the hours in the height the
     sheet opens at, or the app opens on half an answer. The heading above the
     verdict is the first thing to go: the verdict says what it is. */
  @media (max-width: 979px) {
    .when-panel { padding: 11px 12px 10px; margin: 8px 0 4px; }
    .when-panel > .fee-h { display: none; }
    .when-panel .verdict { margin-top: 0 !important; }
    #when .day-bars { height: 58px; margin: 7px 0 4px; }
  }

  /* ---- what it costs through the day --------------------------------- */
  /* The reason this app exists. Live availability is answered by other sites;
     none of them answer "come at six instead and it is half the price". */
  .day-box { border: 1px solid var(--line); border-radius: 12px; padding: 13px; margin-top: 12px; }
  .day-bars { display: flex; align-items: flex-end; gap: 2px; height: 74px; margin: 10px 0 5px; }
  .day-bars button {
    flex: 1 1 0; min-width: 0; padding: 0; border: none; background: none;
    height: 100%; display: flex; align-items: flex-end; cursor: pointer; border-radius: 3px;
  }
  .day-bars button:hover i { filter: brightness(1.25); }
  .day-bars i {
    display: block; width: 100%; border-radius: 3px 3px 0 0; background: var(--muted);
    opacity: .55; min-height: 3px;
  }
  .day-bars .best i { background: var(--ok); opacity: 1; }
  .day-bars .free i { background: var(--ok); opacity: .45; }
  .day-bars .now i { background: var(--ink); opacity: .95; }
  .day-bars .none i { background: repeating-linear-gradient(45deg, var(--line), var(--line) 2px, transparent 2px, transparent 4px); opacity: 1; }
  /* Hours that have already gone. Shown, because they are the context that
     makes the rest of the day legible, but never recommended and not clickable. */
  .day-bars .past i { opacity: .16; }
  .day-bars button:disabled { cursor: default; }
  .day-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .day-note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .day-note b { color: var(--ink); }

  /* ---- arriving later ------------------------------------------------ */
  .when-grid { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #atTime {
    font: inherit; font-size: 14px; font-variant-numeric: tabular-nums; padding: 5px 9px;
    border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .cheapest-tag { color: var(--ok); border-color: currentColor; font-weight: 600; }

  /* ---- list --------------------------------------------------------- */
  .where { font-size: 13px; color: var(--muted); margin: 9px 0 6px; }
  .where strong { color: var(--ink); }
  .row {
    position: relative; width: 100%; text-align: left; display: block;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 13px; margin-bottom: 8px; color: inherit; font: inherit; cursor: pointer;
  }
  .row:hover { border-color: var(--muted); }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-right: 26px; }
  .row h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .price { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .price.free { color: var(--ok); }
  .price.none { color: var(--muted); font-size: 13px; font-weight: 500; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5; flex: 0 0 auto; }
  .lots { display: flex; align-items: baseline; gap: 7px; margin-top: 9px; }
  .n { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .of { color: var(--muted); font-size: 13px; }
  .barline { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 7px; }
  .barline > i { display: block; height: 100%; border-radius: 3px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .tag { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.free { color: var(--ok); border-color: currentColor; font-weight: 600; }
  .tag.stale { color: var(--warn); border-color: currentColor; }
  .tag.dear { color: var(--bad); border-color: currentColor; }
  .star {
    position: absolute; top: 7px; right: 7px; padding: 3px 7px; border: none;
    background: none; font-size: 19px; line-height: 1; color: var(--muted); cursor: pointer;
  }
  .star.on { color: #e0a33a; }
  .note { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 11px; margin: 12px 0; }
  .note a { color: inherit; }
  .err { color: var(--bad); }
  .choice { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }

  /* ---- detail ------------------------------------------------------- */
  .back { background: none; border: none; padding: 8px 0; color: var(--muted); font-size: 14px; cursor: pointer; }
  .detail h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.3; letter-spacing: -0.01em; }
  .fee-box { border: 1px solid var(--line); border-radius: 12px; padding: 13px; margin-top: 14px; display: flex; flex-direction: column; gap: 11px; }
  .fee-h { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .fee-total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .fee-n { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .fee-n.free { color: var(--ok); }
  .fee-n.none { font-size: 18px; color: var(--muted); }
  .fee-when { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.4; }
  .breakdown { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .brow { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
  .brow span:last-child { white-space: nowrap; }
  .brow.sum { border-top: 1px solid var(--line); padding-top: 6px; color: var(--ink); font-weight: 600; }
  .maps { display: block; margin-top: 14px; text-decoration: none; }
  .maps button { width: 100%; }

  /* ---- map pins ----------------------------------------------------- */
  .pin { display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); }
  .pin .lab {
    display: flex; align-items: baseline; gap: 4px; background: var(--ok); color: #fff;
    border-radius: 999px; padding: 2px 7px; box-shadow: 0 1px 4px rgb(0 0 0 / .35);
    font-size: 12px; font-weight: 700; line-height: 1.35; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .pin .lab em { font-style: normal; font-size: 10px; font-weight: 600; opacity: .85; }
  .pin .stem { width: 2px; height: 6px; background: var(--ok); }
  .pin.warn .lab, .pin.warn .stem { background: var(--warn); }
  .pin.bad .lab, .pin.bad .stem { background: var(--bad); }
  .pin.unknown .lab, .pin.unknown .stem { background: var(--muted); }
  .pin.collapsed .lab { padding: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--card); }
  .pin.collapsed .lab > * { display: none; }
  .pin.collapsed .stem { display: none; }
  .pin.chosen .lab { outline: 2px solid var(--ink); outline-offset: 1px; }
  .leaflet-marker-icon.pin-icon { background: none; border: none; width: 0 !important; height: 0 !important; }
  .me-dot {
    width: 14px; height: 14px; border-radius: 50%; background: #1a73e8;
    border: 2.5px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .25);
    transform: translate(-50%, -50%);
  }
  .leaflet-control-attribution { font-size: 10px; }
  .map-btn {
    position: absolute; z-index: 400; right: 10px; padding: 9px 11px; line-height: 1;
    box-shadow: 0 1px 5px var(--scrim); font-size: 15px;
  }
  #locate { top: 10px; }
  #layoutBtn { top: 58px; }
  /* Finding you can take several seconds, and a button that only greys out
     looks like a button that did nothing. */
  #locate[aria-busy="true"] { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ---- notices ------------------------------------------------------- */
  /* Above everything the list draws, because render() rewrites the list on
     every map move - an error written into the list disappears the moment the
     map settles, which is exactly when the user is looking for it. */
  #notice {
    display: flex; align-items: flex-start; gap: 10px; margin: 10px 0 0;
    border: 1px solid var(--line); border-left: 3px solid var(--muted);
    border-radius: 10px; padding: 10px 11px; font-size: 13px; color: var(--ink);
  }
  #notice.bad { border-left-color: var(--bad); }
  #notice.busy { border-left-color: var(--ok); }
  #notice p { margin: 0; flex: 1 1 auto; }
  #notice b { display: block; font-weight: 600; margin-bottom: 2px; }
  #notice small { color: var(--muted); font-size: 12px; }
  #notice button {
    flex: 0 0 auto; border: none; background: none; color: var(--muted);
    font-size: 17px; line-height: 1; padding: 0 2px; cursor: pointer;
  }

  /* ---- search suggestions ------------------------------------------- */
  .qwrap { position: relative; flex: 1; min-width: 0; }
  .sugg {
    position: absolute; z-index: 900; left: 0; right: 0; top: calc(100% + 5px);
    margin: 0; padding: 5px; list-style: none; max-height: 46vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 28px var(--scrim);
  }
  .sugg li {
    padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.35;
  }
  .sugg li[aria-selected="true"], .sugg li:hover { background: var(--bg); }
  .sugg b { display: block; font-weight: 600; }
  .sugg span { color: var(--muted); font-size: 12px; }
  .sugg .hint { color: var(--muted); font-size: 12px; cursor: default; padding: 7px 10px; }
  .sugg .hint:hover { background: none; }

  /* ---- the stay: when you arrive, and for how long -------------------- */
  .stay { display: flex; flex-direction: column; gap: 7px; }
  .slab { display: block; }
  .slab-h {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    font-size: 13px; color: var(--muted); margin-bottom: 2px;
  }
  .slab-h b { color: var(--ink); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .slab-h em { font-style: normal; font-variant-numeric: tabular-nums; }
  /* Length of stay is a magnitude with no exact value in mind - "about two
     hours" - which is what a slider is for. Arrival time is the opposite: it is
     a specific moment, and dragging for it is guesswork, so that one is a real
     time field. Styled explicitly because the platform default is inconsistent
     and, on Windows, tiny. */
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 20px;
    background: none; cursor: pointer; margin: 0; display: block;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 5px; border-radius: 3px; background: var(--line);
  }
  input[type="range"]::-moz-range-track { height: 5px; border-radius: 3px; background: var(--line); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 19px; height: 19px; margin-top: -7px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--card);
    box-shadow: 0 1px 4px var(--scrim);
  }
  input[type="range"]::-moz-range-thumb {
    width: 19px; height: 19px; border: 2px solid var(--card); border-radius: 50%;
    background: var(--accent); box-shadow: 0 1px 4px var(--scrim);
  }
  /* :not([hidden]) matters. A bare `display: flex` beats the hidden attribute,
     and the arrival controls then hold 84px of a phone's sheet open while being
     invisible - which left no room for the list they are meant to filter. */
  #laterBox:not([hidden]) { display: flex; flex-direction: column; gap: 6px; }
  #onDate {
    font: inherit; font-size: 13px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }

  /* ---- desktop: a rail beside the map, not a drawer under it ---------- */
  /* At 1920px the phone layout letterboxes the map and hides the list in a
     drawer. On a wide screen the map should be the page and the list should
     sit next to it, which is also what makes dragging unnecessary there. */
  @media (min-width: 980px) {
    #app { flex-direction: row; --rail: clamp(340px, 26vw, 440px); }
    /* Straddling the rail's edge, so it reads as "collapse this panel" rather
       than as another map control. */
    #layoutBtn { top: 12px; right: auto; left: calc(var(--rail) - 17px); border-radius: 8px; }
    #app[data-rail="off"] #layoutBtn { left: 10px; }
    #app[data-layout] #map {
      position: relative; inset: auto; flex: 1 1 auto; height: 100%; min-width: 0;
    }
    #app[data-layout] #sheet {
      position: relative; inset: auto; order: -1; height: 100%;
      /* Width on its own, NOT inside the flex shorthand: `flex: 0 0 clamp(...)`
         fails to parse, and the rail then silently falls back to sharing the
         window - which measured 795px of a 1024px screen. */
      flex: 0 0 auto; width: var(--rail);
      border-radius: 0; border-right: 1px solid var(--line);
      box-shadow: 2px 0 14px var(--scrim);
    }
    #app[data-layout] #grip { display: none; }
    /* The layout button becomes "give the map the whole window". */
    #app[data-rail="off"] #sheet { display: none; }
    #sheetHead { padding: 14px 16px 12px; }
    #sheetBody { padding: 0 16px 28px; }
    /* A sideways-scrolling chip row with no visible edge hides half the filters
       on a screen with room for all of them. */
    #sheetHead .chips { flex-wrap: wrap; overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <button id="locate" class="map-btn" title="Find carparks near me" aria-label="Find carparks near me">◎</button>
  <button id="layoutBtn" class="map-btn" title="Switch layout" aria-label="Switch layout">▤</button>

  <div id="sheet">
    <div id="grip" role="separator" aria-label="Drag to resize the list"><i></i></div>
    <div id="sheetHead">
      <form class="bar-row" id="searchForm" autocomplete="off">
        <div class="qwrap">
          <input id="q" type="search" placeholder="Place, road or postcode"
                 aria-label="Search for a destination" role="combobox"
                 aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
          <ul class="sugg" id="sugg" role="listbox" aria-label="Search suggestions" hidden></ul>
        </div>
        <button type="submit" class="icon-btn" id="go" aria-label="Search">→</button>
      </form>
      <div class="stay">
        <span class="chips" role="group" aria-label="When you are parking">
          <button type="button" class="chip" id="whenNow" aria-pressed="true">Park now</button>
          <button type="button" class="chip" id="whenLater" aria-pressed="false">Later</button>
        </span>

        <div id="laterBox" hidden>
          <!-- An arrival time is an exact moment, not a magnitude. Dragging to
               6.45pm is guesswork, so this is a real time field; the chips carry
               the answers people actually give ("in an hour", "this evening").
               Where the price of arriving LATER is the question, the answer is
               the chart in the carpark panel, not a slider up here. -->
          <div class="when-grid">
            <input type="time" id="atTime" step="900" aria-label="Arrival time">
            <span class="chips" role="group" aria-label="Common arrival times">
              <button type="button" class="chip" data-in="60">in 1 h</button>
              <button type="button" class="chip" data-in="180">in 3 h</button>
              <button type="button" class="chip" data-at="1140">7pm</button>
              <button type="button" class="chip" data-at="540">9am</button>
            </span>
          </div>
          <div class="when-grid">
            <span class="chips" role="group" aria-label="Which day">
              <button type="button" class="chip" data-day="0" aria-pressed="true">Today</button>
              <button type="button" class="chip" data-day="1" aria-pressed="false">Tomorrow</button>
            </span>
            <input type="date" id="onDate" aria-label="Another date">
          </div>
          <div class="slab-h"><span>Arriving</span><b id="startLabel">—</b></div>
        </div>

        <label class="slab">
          <span class="slab-h"><span>Stay for</span><b id="durLabel">2 hours</b></span>
          <!-- An index into DURATIONS, not raw minutes: the useful resolution is
               fifteen minutes for a short stay and an hour for a long one, and a
               linear minute scale gives neither. Capped at 12 hours on purpose -
               these are lengths measured from arrival, and anything longer runs
               past closing time at the 241 carparks that shut at 10.30pm. The
               daily cap still shows itself, because 12 hours costs more than $12. -->
          <input type="range" id="dur" min="0" max="14" step="1" value="5"
                 aria-label="How long you are staying">
          <span class="chips" id="durPresets" role="group" aria-label="Common lengths of stay"></span>
        </label>
      </div>
      <div class="ctl-row">
        <span class="ctl-lab" id="sortLab">Show</span>
        <div class="seg" id="sortSeg" role="group" aria-labelledby="sortLab"></div>
      </div>
      <div class="ctl-row">
        <span class="ctl-lab" id="typeLab">Type</span>
        <div class="chips" id="typeChips" role="group" aria-labelledby="typeLab"></div>
      </div>
    </div>
    <div id="sheetBody">
      <div id="notice" hidden role="status" aria-live="polite"></div>
      <!-- Answered before the list, because it is the question the list cannot
           answer: not "which carpark", but "what hour". -->
      <div id="when"></div>
      <div id="saved"></div>
      <div class="where" id="where"></div>
      <div id="list"></div>
      <div class="note" id="scope">
        <strong>Prices are for motor cars at HDB and URA carparks.</strong> Shopping-mall and private
        carparks are not included yet, so an empty list here does not mean there is no parking
        nearby. Hours with no published rate are shown as such rather than guessed at.
      </div>
    </div>
  </div>
</div>

<script src="lib/leaflet.js"></script>
<script src="rates.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const R = window.CarparkRates.rates;
const W = window.CarparkRates.windows;
// URA carparks publish their own prices, so they are priced by their own
// engine off their own rate table. Both engines return the same shape, which
// is what lets one list mix the two sources without special-casing every row.
const U = window.CarparkRates.ura;

const state = {
  carparks: null, windows: [], rateTables: [], holidays: new Set(), patterns: {},
  live: null, fetchedAt: null,
  me: null,                              // where the browser says you are, once granted
  centre: { lat: 1.3521, lng: 103.8198 },
  selected: null,
  types: new Set(),                      // empty means every type
  sort: "near",
  stay: { start: null, minutes: 120 },   // start null means "now"
  map: null, markers: new Map(), meMarker: null, lastRows: [],
  // Opens showing the verdict, not just the controls that produce it. The map
  // still gets 44% of a phone screen, and the sheet drags freely from there.
  layoutA: true, sheetFraction: 0.6,
};

// Straight-line distance. Labelled as such in the UI - real walking distance
// needs routing we deliberately do not do.
function haversine(aLat, aLng, bLat, bLng) {
  const E = 6371000, toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(bLat - aLat), dLng = toRad(bLng - aLng);
  const s = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * Math.sin(dLng / 2) ** 2;
  return 2 * E * Math.asin(Math.sqrt(s));
}

const isHoliday = (iso) => state.holidays.has(iso);
const sgDate = (d) => new Date(d.getTime() + 8 * 3600 * 1000).toISOString().slice(0, 10);

// The compact record the page downloads, expanded into what the rate engine
// expects. Window sets are stored once and referenced by index, so this is
// where an index becomes actual windows again.
function forEngine(c) {
  return {
    id: c.i,
    parkingSystem: c.c ? "COUPON PARKING" : "ELECTRONIC PARKING",
    nightParking: !!c.n,
    shortTermParking: state.windows[c.s] || [],
    freeParking: state.windows[c.f] || [],
    rates: c.r === undefined ? null : (state.rateTables[c.r] || []),
  };
}

// A record that points at a rate table brought its prices with it; one that
// does not is priced from HDB's transcribed schedule.
const hasOwnRates = (c) => c.r !== undefined;

// Fifteen-minute resolution for a short stay, an hour for a long one. A linear
// minute slider gives neither: 15 and 30 minutes are a real difference to a
// driver (the HDB grace period sits between them) and 9 versus 10 hours is not.
const DURATIONS = [15, 30, 45, 60, 90, 120, 150, 180, 240, 300, 360, 420, 480, 600, 720];
const DUR_PRESETS = [30, 60, 120, 240];

function durationLabel(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  if (!h) return m + " min";
  const hs = h + (h === 1 ? " hour" : " hours");
  return m ? hs + " " + m + " min" : hs;
}

const SG_TIME = { hour: "numeric", minute: "2-digit", timeZone: "Asia/Singapore" };
const clockAt = (d) => d.toLocaleTimeString("en-SG", SG_TIME).toLowerCase().replace(/\s/g, "");
const dayAt = (d) => d.toLocaleDateString("en-SG",
  { weekday: "short", day: "numeric", month: "short", timeZone: "Asia/Singapore" });

const stayStart = () => state.stay.start ? new Date(state.stay.start) : new Date();
// Price a carpark for any moment, which the through-the-day chart needs and the
// list gets by passing the stay's own start.
const feeForCarpark = (c, start, minutes) => (hasOwnRates(c) ? U : R)
  .feeFor(forEngine(c), start, minutes, isHoliday);
const priceOf = (c) => feeForCarpark(c, stayStart(), state.stay.minutes);
const money = (n) => "$" + n.toFixed(2);

// Mirrors src/quality.js. A large carpark reporting EVERY lot free is almost
// certainly a carpark whose sensors are offline, not an empty one: in a single
// snapshot 36 carparks reported 100% free, including one with 2,754 lots.
// Below 50 lots an empty carpark is entirely believable, so those are left
// alone - crying wolf there teaches people to ignore the warning.
function looksUnreported(total, available) {
  if (!total || available === null || available === undefined) return false;
  return available === total && total >= 50;
}

// Mirrors src/patterns.js. Three day types by 24 hours: an HDB carpark is
// packed overnight and empty at 10am on a WEEKDAY, and still packed at 10am on
// a Sunday. A public holiday behaves like a Sunday, not like the Tuesday it
// happens to fall on.
function bucketFor(now, isPH) {
  const sg = new Date(now.getTime() + 8 * 3600 * 1000);
  const dow = sg.getUTCDay();
  const type = isPH || dow === 0 ? 2 : dow === 6 ? 1 : 0;
  return type * 24 + sg.getUTCHours();
}

function typicalNow(id, now) {
  const p = state.patterns[id];
  if (!p) return null;
  const ch = p[bucketFor(now, isHoliday(sgDate(now)))];
  if (!ch || ch === "-") return null;
  return Number(ch) / 9;
}

const TYPE_NAMES = {
  S: "Surface", M: "Multi-storey", B: "Basement", C: "Covered",
  E: "Mechanised", X: "Mechanised + surface", U: "Surface + multi-storey",
  // URA's two. On-street is a row of bays on a public road - parallel parking,
  // pay by coupon or app - and it is a different proposition from a lot you
  // drive into, so it is worth its own filter.
  T: "On-street", O: "Off-street", "?": "Carpark",
};
const FILTERS = [
  { key: "M", label: "Multi-storey" },
  { key: "S", label: "Surface" },
  { key: "B", label: "Basement" },
  { key: "C", label: "Covered" },
  { key: "T", label: "On-street" },
  { key: "O", label: "Off-street" },
];

// Sorting answers a different question from filtering, and only one order can
// be true at a time.
const SORTS = [
  { key: "near", label: "Nearest" },
  { key: "cheap", label: "Cheapest" },
  { key: "lots", label: "Most lots" },
];

// A carpark that cannot be priced or is not reporting has no place at the top
// of a "cheapest" or "emptiest" list, so it sorts last instead of sorting as
// zero. Ties fall back to distance, which is the only ordering that is always
// meaningful.
const SORTERS = {
  near: (a, b) => a.d - b.d,
  cheap: (a, b) => {
    const pa = a.fee.total === null ? Infinity : a.fee.total;
    const pb = b.fee.total === null ? Infinity : b.fee.total;
    return pa - pb || a.d - b.d;
  },
  lots: (a, b) => {
    const la = a.live && a.live.available !== null ? a.live.available : -1;
    const lb = b.live && b.live.available !== null ? b.live.available : -1;
    return lb - la || a.d - b.d;
  },
};

async function loadStatic() {
  const [c, h, p] = await Promise.all([
    fetch("carparks.min.json").then((r) => r.json()),
    fetch("holidays.json").then((r) => r.json()).catch(() => []),
    // Patterns are built from history we collect ourselves, so this file is
    // legitimately empty for the first couple of weeks. Absent or empty must
    // both simply mean "no prediction", never an error.
    fetch("patterns.json").then((r) => r.json()).catch(() => ({ data: {} })),
  ]);
  state.carparks = c.carparks;
  state.windows = c.windows;
  state.rateTables = c.rateTables || [];
  state.holidays = new Set(h);
  state.patterns = (p && p.data) || {};
}

// Fetched straight from data.gov.sg: the API sends Access-Control-Allow-Origin: *,
// so no server of our own sits in the middle.
async function loadLive() {
  const r = await fetch("https://api.data.gov.sg/v1/transport/carpark-availability");
  const j = await r.json();
  const map = new Map();
  for (const c of (j.items?.[0]?.carpark_data) || []) {
    const car = (c.carpark_info || []).find((i) => i.lot_type === "C") || c.carpark_info?.[0];
    if (!car) continue;
    const total = parseInt(car.total_lots, 10);
    map.set("hdb:" + c.carpark_number.trim().toUpperCase(), {
      // A reported total of 0 means NOT REPORTING, not full. Showing it as full
      // would send people away from a carpark that has space.
      total: total > 0 ? total : null,
      available: total > 0 ? parseInt(car.lots_available, 10) : null,
      at: c.update_datetime ? new Date(c.update_datetime + "+08:00") : null,
    });
  }
  state.live = map;
  state.fetchedAt = new Date();
}

function tidy(address) {
  return address.replace(/\bBLK\b/g, "Blk").replace(/\s+/g, " ")
    .toLowerCase().replace(/\b[a-z]/g, (m) => m.toUpperCase());
}
const fmtDist = (d) => d < 1000 ? Math.round(d) + " m" : (d / 1000).toFixed(1) + " km";

// Saved carparks live in this browser only. There is no account and no server,
// so there is nothing to lose or leak - and nothing to sync either, which is
// stated in the UI rather than left for someone to discover on a second device.
const SAVED_KEY = "carpark-sg:saved";
const LAYOUT_KEY = "carpark-sg:layout";

function loadSaved() {
  // Private browsing and blocked site data both throw here. Favourites are a
  // convenience; losing them must never stop the app working.
  try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; } catch (e) { return []; }
}
function toggleSaved(id) {
  const saved = loadSaved();
  const next = saved.includes(id) ? saved.filter((x) => x !== id) : saved.concat(id);
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(next)); } catch (e) {}
}

/* ---- what the map is looking at ------------------------------------ */

// Anchored on the map centre rather than your GPS position, because panning
// somewhere to ask "what would parking cost over there" is the whole reason to
// put a map on the front.
function shortlist(limit) {
  const c0 = state.centre;
  return state.carparks
    .filter((c) => !state.types.size || state.types.has(c.t))
    .map((c) => ({ c, d: haversine(c0.lat, c0.lng, c.y, c.x) }))
    // Take the nearest N FIRST, and only then apply the chosen order. Sorting
    // the whole island by price would answer "where is the cheapest carpark in
    // Singapore", which is a question nobody driving has ever asked; this
    // answers "of the ones around here, which is cheapest".
    .sort((a, b) => a.d - b.d)
    .slice(0, limit)
    .map((x) => ({ c: x.c, d: x.d, fee: priceOf(x.c), live: state.live && state.live.get(x.c.i) }))
    .sort(SORTERS[state.sort] || SORTERS.near);
}

function occupancy(live) {
  if (!live || live.total === null || live.available === null) return null;
  return Math.max(0, Math.min(1, live.available / live.total));
}

function feeText(fee) {
  if (fee.unavailable === "season-only") return { text: "Season only", cls: "none" };
  // "Closed then" is a claim about the carpark. Where URA simply publishes no
  // rate for those hours we do not know whether it is closed, free, or barred
  // to parking, so the label says only what is true: we have no price.
  if (fee.unavailable === "rate-not-published") return { text: "Price not published", cls: "none" };
  if (fee.unavailable === "no-rates") return { text: "No rate published", cls: "none" };
  if (fee.unavailable) return { text: "Closed then", cls: "none" };
  if (fee.total === 0) return { text: "Free", cls: "free" };
  return { text: money(fee.total), cls: "" };
}

/* ---- map ----------------------------------------------------------- */

// Below 980px the sheet floats over the bottom of a full-bleed map, so the
// map's own centre can sit behind it. Anchoring the list to the centre of the
// VISIBLE strip is what stops "cheapest near the middle of the map" describing
// somewhere the user cannot see - and it is why dragging the sheet no longer
// throws away the place they were looking at.
function hiddenMapPixels() {
  if (!state.map || !state.layoutA || window.innerWidth >= 980) return 0;
  const sheet = $("#sheet").getBoundingClientRect().height;
  return Math.min(sheet, state.map.getSize().y * 0.75);
}

function visibleCentre() {
  const size = state.map.getSize();
  const c = state.map.containerPointToLatLng([size.x / 2, (size.y - hiddenMapPixels()) / 2]);
  return { lat: c.lat, lng: c.lng };
}

function initMap() {
  const map = L.map("map", { zoomControl: false })
    .setView([state.centre.lat, state.centre.lng], 16);

  // OneMap is the Singapore Land Authority's own basemap: free, no API key,
  // CORS-open, and the only tile source that draws HDB blocks properly. Grey
  // and Night are the same map in two skins, so the app can follow the phone's
  // theme instead of glowing white in a car at night.
  const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  L.tileLayer("https://www.onemap.gov.sg/maps/tiles/" + (dark ? "Night" : "Grey") + "/{z}/{x}/{y}.png", {
    minZoom: 11, maxZoom: 19,
    // Singapore only: panning into Malaysia would just load blank tiles.
    bounds: L.latLngBounds([1.144, 103.535], [1.494, 104.502]),
    attribution: '<a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener">OneMap</a> &copy; ' +
      '<a href="https://www.sla.gov.sg/" target="_blank" rel="noopener">Singapore Land Authority</a>',
  }).addTo(map);

  map.on("moveend", () => {
    state.centre = visibleCentre();
    if (!state.selected) render();
  });
  map.on("zoomend", relayoutPins);
  state.map = map;
}

function pinClass(row) {
  if (row.fee.unavailable) return "unknown";
  const occ = occupancy(row.live);
  if (occ === null) return "unknown";
  return occ > 0.2 ? "" : occ > 0.05 ? "warn" : "bad";
}

function pinHtml(row) {
  const f = feeText(row.fee);
  // A pin has room for a price, not a sentence. "Season only" and "Closed then"
  // are the list's wording; on the map they would be wider than the carpark.
  const label = row.fee.unavailable === "season-only" ? "Season"
    : row.fee.unavailable ? "Shut" : f.text;
  const lots = row.live && row.live.available !== null ? row.live.available : row.live ? "?" : "–";
  return '<div class="pin ' + pinClass(row) + (row.c.i === state.selected ? " chosen" : "") + '">' +
    '<div class="lab"><span>' + label + "</span><em>" + lots + "</em></div>" +
    '<div class="stem"></div></div>';
}

function drawPins(rows) {
  const wanted = new Set(rows.map((r) => r.c.i));
  for (const [id, m] of state.markers) {
    if (!wanted.has(id)) { state.map.removeLayer(m); state.markers.delete(id); }
  }
  for (const row of rows) {
    const icon = L.divIcon({ className: "pin-icon", html: pinHtml(row), iconSize: [0, 0] });
    const existing = state.markers.get(row.c.i);
    if (existing) { existing.setIcon(icon); continue; }
    const m = L.marker([row.c.y, row.c.x], { icon, keyboard: false, riseOnHover: true })
      .addTo(state.map)
      .on("click", () => openDetail(row.c.i));
    state.markers.set(row.c.i, m);
  }
  relayoutPins();
}

// A pin carries a price AND a lot count, which makes it wide, and in town
// carparks sit close enough together that the labels would pile into an
// unreadable heap. So in any cluster the pin the list ranks highest keeps its
// label and the ones it would cover collapse to dots: no carpark disappears,
// only the text on it. Priority follows the chosen order, so sorting by
// Cheapest leaves the cheapest price readable rather than whichever pin
// happened to be nearest.
function relayoutPins() {
  if (!state.map) return;
  const items = [];
  for (const [id, m] of state.markers) {
    const el = m.getElement();
    if (!el || !el.firstChild) continue;
    el.firstChild.classList.remove("collapsed");
    items.push({ id, el: el.firstChild, pt: state.map.latLngToContainerPoint(m.getLatLng()) });
  }
  // Measure only after everything is expanded, so the widths are real ones.
  for (const it of items) {
    const r = it.el.getBoundingClientRect();
    it.w = r.width || 44;
    it.h = r.height || 22;
  }
  const order = new Map(state.lastRows.map((r, i) => [r.c.i, i]));
  items.sort((a, b) => (order.has(a.id) ? order.get(a.id) : 1e9) - (order.has(b.id) ? order.get(b.id) : 1e9));

  const placed = [];
  const hits = (b) => placed.some((p) => b.x1 < p.x2 && b.x2 > p.x1 && b.y1 < p.y2 && b.y2 > p.y1);
  for (const it of items) {
    const half = it.w / 2;
    const box = { x1: it.pt.x - half, x2: it.pt.x + half, y1: it.pt.y - it.h, y2: it.pt.y };
    if (hits(box)) {
      it.el.classList.add("collapsed");
      placed.push({ x1: it.pt.x - 7, x2: it.pt.x + 7, y1: it.pt.y - 14, y2: it.pt.y });
    } else {
      placed.push(box);
    }
  }
}

/* ---- the list ------------------------------------------------------ */

function cardHtml(row) {
  const now = new Date();
  const c = row.c, fee = row.fee, live = row.live;
  const freeNow = W.isFreeAt(state.windows[c.f], now, isHoliday(sgDate(now)));
  const f = feeText(fee);
  const isSaved = loadSaved().indexOf(c.i) !== -1;
  const occ = occupancy(live);

  let lots = '<span class="meta">' + (hasOwnRates(c)
    ? "No live count published for this one" : "No live data for this carpark") + "</span>";
  if (occ !== null) {
    const colour = occ > 0.2 ? "var(--ok)" : occ > 0.05 ? "var(--warn)" : "var(--bad)";
    lots = '<span class="lots"><span class="n" style="color:' + colour + '">' + live.available +
      '</span><span class="of">of ' + live.total + ' lots free</span></span>' +
      '<span class="barline"><i style="width:' + (occ * 100).toFixed(0) + '%;background:' + colour + '"></i></span>';
  } else if (live) {
    lots = '<span class="meta">Not reporting lot counts right now</span>';
  }

  const cheapest = state.cheapestNearby;
  const delta = fee.total !== null && cheapest !== null ? fee.total - cheapest : null;
  const tags = [
    delta === 0 && state.priceSpread
      ? '<span class="tag cheapest-tag">Cheapest nearby</span>' : "",
    delta ? '<span class="tag">+' + money(delta) + " vs cheapest nearby</span>" : "",
    freeNow ? '<span class="tag free">Free right now</span>' : "",
    fee.peak ? '<span class="tag dear">Peak-hour rates</span>' : "",
    fee.central && !fee.peak ? '<span class="tag dear">Central Area</span>' : "",
    fee.capApplied === "night" ? '<span class="tag">Night cap</span>' : "",
    fee.capApplied === "day" ? '<span class="tag">Daily cap</span>' : "",
    fee.capApplied === "window" ? '<span class="tag">Flat night rate</span>' : "",
    live && looksUnreported(live.total, live.available)
      ? '<span class="tag stale">Reports every lot free - sensors may be down</span>' : "",
  ].filter(Boolean).join("");

  return '<button class="row" data-id="' + c.i + '">' +
    '<span class="star' + (isSaved ? " on" : "") + '" data-star="' + c.i + '" role="button" tabindex="0" ' +
      'aria-label="' + (isSaved ? "Remove from saved" : "Save this carpark") + '">' +
      (isSaved ? "★" : "☆") + "</span>" +
    '<span class="row-top"><h2>' + tidy(c.a) + "</h2>" +
      '<span class="price ' + f.cls + '">' + f.text + "</span></span>" +
    '<span class="meta"><span>' + fmtDist(row.d) + '</span><span class="dot"></span>' +
      "<span>" + (TYPE_NAMES[c.t] || "Carpark") + "</span>" +
      (c.g ? '<span class="dot"></span><span>' + c.g + "m gantry</span>" : "") + "</span>" +
    lots + (tags ? '<span class="tags">' + tags + "</span>" : "") + "</button>";
}

function wireRows(root) {
  root.querySelectorAll("[data-star]").forEach((s) => {
    s.addEventListener("click", (e) => { e.stopPropagation(); toggleSaved(s.dataset.star); render(); });
  });
  root.querySelectorAll(".row[data-id]").forEach((b) => {
    b.addEventListener("click", () => openDetail(b.dataset.id));
  });
}

function render() {
  if (!state.carparks) return;
  if (state.selected) { renderDetail(); return; }

  const rows = shortlist(40);
  state.lastRows = rows;
  // What the cheapest option around here actually costs. Every other row is
  // then quoted against it, because "$4.80" only means something next to the
  // $2.40 two streets away - and that comparison is the reason to open this
  // app rather than one that only shows which carparks have space.
  const priced = rows.map((r) => r.fee.total).filter((t) => t !== null);
  state.cheapestNearby = priced.length ? Math.min.apply(null, priced) : null;
  // Only worth saying when there is something to choose between. In a stretch
  // where nine streets all charge $2.40, nine green "Cheapest nearby" badges
  // tell the reader nothing except that the badge is meaningless.
  state.priceSpread = new Set(priced).size > 1;
  drawPins(rows);

  const byId = new Map(state.carparks.map((c) => [c.i, c]));
  const saved = loadSaved().map((id) => byId.get(id)).filter(Boolean).map((c) => ({
    c, d: haversine(state.centre.lat, state.centre.lng, c.y, c.x),
    fee: priceOf(c), live: state.live && state.live.get(c.i),
  }));

  $("#when").innerHTML = whenPanelHtml(rows);
  wireHourBars($("#when"));
  $("#saved").innerHTML = saved.length
    ? '<div class="where">Saved</div>' + saved.map(cardHtml).join("") : "";
  $("#list").innerHTML = rows.length
    ? rows.slice(0, 15).map(cardHtml).join("")
    : '<div class="note">No carparks of that type near here. Try clearing the filters or moving the map.</div>';
  $("#scope").hidden = false;
  wireRows($("#sheetBody"));

  // Say what the distances are measured from. Once the map has been panned away
  // from you, "310 m" would otherwise quietly start meaning something else.
  const nearMe = state.me &&
    haversine(state.me.lat, state.me.lng, state.centre.lat, state.centre.lng) < 60;
  const lead = { near: "Nearest to", cheap: "Cheapest near", lots: "Emptiest near" }[state.sort];
  $("#where").innerHTML = lead + " <strong>" + (nearMe ? "you" : "the middle of the map") + "</strong>" +
    (state.fetchedAt ? " &middot; live as of " +
      state.fetchedAt.toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" }) : "");
}

/* ---- when to go ---------------------------------------------------- */

// The cheapest parking around here, hour by hour, for the stay you asked about.
//
// This is the question this app is FOR. Other sites answer "which carpark is
// nearest / has space / is cheapest right now", and answer it well. None of
// them answer "wait until five and it costs nothing", even though Singapore's
// rates step at 8.30am, 5pm and 10.30pm and change again on Sundays.
//
// Capped at the nearest 25 carparks: this runs on every pan, and the answer
// does not improve by pricing the 40th-nearest street too.
function areaByHour(rows) {
  const near = rows.slice(0, 25).map((r) => r.c);
  const day = sgParts(stayStart()).date;
  const out = [];
  for (let h = 0; h < 24; h++) {
    const at = sgDateAt(day, h * 60);
    let best = null;
    let who = null;
    for (const c of near) {
      const fee = feeForCarpark(c, at, state.stay.minutes);
      if (fee.total === null) continue;
      if (best === null || fee.total < best) { best = fee.total; who = c; }
    }
    out.push({ hour: h, total: best, carpark: who });
  }
  return out;
}

const priceWord = (v) => (v === 0 ? "free" : money(v));

function whenPanelHtml(rows) {
  if (!rows.length) return "";
  const hours = areaByHour(rows);
  const priced = hours.filter((h) => h.total !== null);
  if (priced.length < 2) return "";

  const day = sgParts(stayStart()).date;
  const at = (h) => clockAt(sgDateAt(day, h * 60));
  const sel = Math.floor(sgParts(stayStart()).minutes / 60);
  const selRow = hours[sel];

  // "Cheapest at 2am" is true and useless: nobody waits thirteen hours to save
  // $2.40, and today those hours have already gone. Advice is only worth giving
  // about hours you can still arrive at, so the verdict looks forward from now,
  // and on a future date at the whole of that day.
  const nowParts = sgParts(new Date());
  const from = day === nowParts.date ? Math.floor(nowParts.minutes / 60) : 0;
  const reachable = priced.filter((h) => h.hour >= from);
  if (!reachable.length) return "";

  const max = Math.max.apply(null, reachable.map((h) => h.total));
  const min = Math.min.apply(null, reachable.map((h) => h.total));
  const bestHours = reachable.filter((h) => h.total === min).map((h) => h.hour);

  // A run of consecutive cheap hours reads as "after 5pm", which is how anyone
  // would actually say it - much better than listing eight times.
  let bestPhrase;
  const runEnd = bestHours.length && bestHours[bestHours.length - 1] === 23;
  const contiguous = bestHours.every((h, i) => i === 0 || h === bestHours[i - 1] + 1);
  if (bestHours.length === 1) bestPhrase = "at " + at(bestHours[0]);
  else if (contiguous && runEnd) bestPhrase = "after " + at(bestHours[0]);
  else if (contiguous) bestPhrase = "between " + at(bestHours[0]) + " and " + at(bestHours[bestHours.length - 1] + 1);
  else bestPhrase = "at " + bestHours.slice(0, 3).map(at).join(", ");

  // Scale against the whole day so the bars stay comparable as hours fall away.
  const scale = Math.max.apply(null, priced.map((h) => h.total));
  const bars = hours.map((h) => {
    const gone = h.hour < from;
    const cls = gone ? "past"
      : h.total === null ? "none"
      : h.hour === sel ? "now"
      : h.total === min && max > min ? "best"
      : h.total === 0 ? "free" : "";
    const height = h.total === null ? 100
      : scale > 0 ? Math.max(4, Math.round((h.total / scale) * 100)) : 6;
    const title = at(h.hour) + ": " +
      (h.total === null ? "no price published" : priceWord(h.total)) + (gone ? " (gone)" : "");
    return '<button type="button" class="' + cls + '" data-hour="' + h.hour + '"' +
      (gone ? " disabled" : "") +
      ' title="' + title + '" aria-label="Arrive ' + title + '">' +
      '<i style="height:' + height + '%"></i></button>';
  }).join("");

  let verdict;
  let sub;
  if (selRow.total === null) {
    verdict = "No price published for " + at(sel);
    sub = "Cheapest " + bestPhrase + ", at <b>" + priceWord(min) + "</b>.";
  } else if (max === min) {
    verdict = '<span class="big">' + priceWord(min) + "</span> whenever you arrive";
    sub = "Parking around here costs the same for the rest of the day.";
  } else if (selRow.total === min) {
    verdict = '<span class="big"><em>' + priceWord(min) + "</em></span> arriving " + at(sel);
    sub = "Nothing later today is cheaper \u2014 it reaches <b>" + money(max) +
      "</b> at the dearest hour still to come. Cheapest: <b>" + tidy(selRow.carpark.a) + "</b>.";
  } else {
    const saving = selRow.total - min;
    verdict = "Arrive <em>" + bestPhrase + "</em> and pay <span class=\"big\"><em>" +
      priceWord(min) + "</em></span>";
    sub = "It is <b>" + priceWord(selRow.total) + "</b> arriving " + at(sel) +
      ', so you save <span class="save">' + money(saving) + "</span> by waiting. Cheapest then: <b>" +
      tidy(hours[bestHours[0]].carpark.a) + "</b>.";
  }

  return '<div class="when-panel">' +
    '<div class="fee-h">Cheapest parking near here, hour by hour</div>' +
    '<div class="verdict" style="margin-top:6px">' + verdict + "</div>" +
    '<div class="verdict-sub">' + sub + "</div>" +
    '<div class="day-bars">' + bars + "</div>" +
    '<div class="day-axis"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>' +
    '<div class="day-note">Tap an hour to price your stay arriving then. Everything below, and every ' +
    "price on the map, moves with it.</div></div>";
}

/* ---- what it costs through the day --------------------------------- */

// Per carpark, the same question the panel above asks for the whole area. Live availability is
// well covered elsewhere; "come at six instead and it is half the price" is
// not, and it falls straight out of the rate engine this app already has.
//
// One price per hour of the chosen day, for the SAME length of stay, so the
// bars are comparable. Hours the carpark cannot be priced for are drawn hatched
// rather than as zero - the difference between "free" and "we do not know" is
// the whole discipline of this project.
function priceByHour(c) {
  const day = sgParts(stayStart()).date;
  const out = [];
  for (let h = 0; h < 24; h++) {
    const fee = feeForCarpark(c, sgDateAt(day, h * 60), state.stay.minutes);
    out.push({ hour: h, total: fee.total, reason: fee.unavailable });
  }
  return out;
}

function dayChartHtml(c) {
  const hours = priceByHour(c);
  const priced = hours.filter((h) => h.total !== null);
  if (priced.length < 2) return "";

  const max = Math.max.apply(null, priced.map((h) => h.total));
  const min = Math.min.apply(null, priced.map((h) => h.total));
  const nowHour = sgParts(stayStart()).minutes / 60 | 0;
  const cheapest = priced.filter((h) => h.total === min).map((h) => h.hour);

  const bars = hours.map((h) => {
    const cls = h.total === null ? "none"
      : h.hour === nowHour ? "now"
      : h.total === min && max > min ? "best"
      : h.total === 0 ? "free" : "";
    const height = h.total === null ? 100
      : max > 0 ? Math.max(4, Math.round((h.total / max) * 100)) : 6;
    const title = clockAt(sgDateAt(sgParts(stayStart()).date, h.hour * 60)) + ": " +
      (h.total === null ? "no price published" : h.total === 0 ? "free" : money(h.total));
    return '<button type="button" class="' + cls + '" data-hour="' + h.hour +
      '" title="' + title + '" aria-label="Arrive at ' + title + '">' +
      '<i style="height:' + height + '%"></i></button>';
  }).join("");

  const at = (h) => clockAt(sgDateAt(sgParts(stayStart()).date, h * 60));
  const note = max > min
    ? "Cheapest arriving <b>" + cheapest.map(at).join(" or ") + "</b> at <b>" +
      (min === 0 ? "no charge" : money(min)) + "</b>, against " + money(max) +
      " at the dearest hour. Tap a bar to price that arrival."
    : "The same " + (min === 0 ? "no charge" : money(min)) +
      " whenever you arrive on this day.";

  return '<div class="day-box"><div class="fee-h">This stay, arriving at each hour</div>' +
    '<div class="day-bars">' + bars + "</div>" +
    '<div class="day-axis"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>' +
    '<div class="day-note">' + note + "</div></div>";
}

/* ---- one carpark --------------------------------------------------- */

function openDetail(id) {
  state.selected = id;
  renderDetail();
  drawPins(state.lastRows);
  $("#sheetBody").scrollTop = 0;
  // Only grow the sheet when it is too small to show the carpark at all. It
  // used to jump to 70% from anything under 60%, which moved the map out from
  // under whoever had just carefully positioned it.
  if (state.layoutA && window.innerWidth < 980 && state.sheetFraction < 0.34) setSheet(0.55);
}

function closeDetail() {
  state.selected = null;
  render();
}

function renderDetail() {
  const c = state.carparks.find((x) => x.i === state.selected);
  if (!c) { closeDetail(); return; }
  const now = new Date();
  const fee = priceOf(c);
  const live = state.live && state.live.get(c.i);
  const occ = occupancy(live);
  const f = feeText(fee);
  const start = stayStart();
  const end = new Date(start.getTime() + state.stay.minutes * 60000);
  const at = (d) => d.toLocaleTimeString("en-SG",
    { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Singapore" });
  const day = start.toLocaleDateString("en-SG",
    { weekday: "short", day: "numeric", month: "short", timeZone: "Asia/Singapore" });

  let lots = '<div class="meta">' + (hasOwnRates(c)
    ? "URA publishes live lot counts for only about one carpark in eight, and not for this one."
    : "No live data for this carpark") + "</div>";
  if (occ !== null) {
    const colour = occ > 0.2 ? "var(--ok)" : occ > 0.05 ? "var(--warn)" : "var(--bad)";
    const age = live.at ? Math.round((now - live.at) / 60000) : null;
    lots = '<div class="lots"><span class="n" style="color:' + colour + '">' + live.available +
      '</span><span class="of">of ' + live.total + ' lots free</span></div>' +
      '<div class="barline"><i style="width:' + (occ * 100).toFixed(0) + '%;background:' + colour + '"></i></div>' +
      (age !== null ? '<div class="meta">Updated ' + (age < 1 ? "just now" : age + " min ago") + "</div>" : "") +
      (looksUnreported(live.total, live.available)
        ? '<div class="meta">Every lot reported free, which usually means the sensors are down.</div>' : "");
  } else if (live) {
    lots = '<div class="meta">Not reporting lot counts right now</div>';
  }

  const usual = typicalNow(c.i, now);
  let usualLine = "";
  if (usual !== null) {
    let s = "Usually " + Math.round(usual * 100) + "% free at this hour";
    if (occ !== null) {
      const gap = occ - usual;
      if (gap <= -0.15) s += " &middot; busier than usual";
      else if (gap >= 0.15) s += " &middot; quieter than usual";
    }
    usualLine = '<div class="meta">' + s + "</div>";
  }

  let feeBody;
  if (fee.unavailable === "season-only") {
    feeBody = '<div class="fee-total"><span class="fee-n none">Season parking only</span></div>' +
      '<div class="note" style="margin:0">HDB does not offer short-term parking here, so there is no ' +
      "hourly rate to quote.</div>";
  } else if (fee.unavailable === "rate-not-published") {
    feeBody = '<div class="fee-total"><span class="fee-n none">Price not published</span></div>' +
      '<div class="note" style="margin:0">URA publishes no rate for part of that stay here. It may ' +
      "mean the parking is free then, and it may mean parking is not allowed at all - the data does " +
      "not say which, and guessing free is the guess that earns a fine. Check the signboard.</div>";
  } else if (fee.unavailable === "no-rates") {
    feeBody = '<div class="fee-total"><span class="fee-n none">No published rate</span></div>' +
      '<div class="note" style="margin:0">URA lists this carpark but publishes no car rates for it.</div>';
  } else if (fee.unavailable) {
    feeBody = '<div class="fee-total"><span class="fee-n none">Not open for that stay</span></div>' +
      '<div class="note" style="margin:0">' + (c.n
        ? "Part of that stay falls outside this carpark's short-term hours."
        : "This carpark has no Night Parking Scheme, so a car cannot be left here overnight.") + "</div>";
  } else {
    const lines = fee.lines.map((l) =>
      '<div class="brow"><span>' + l.label + (l.from ? " &middot; " + at(l.from) + "–" + at(l.to) : "") +
      "</span><span>" + (l.amount < 0 ? "−" : "") + money(Math.abs(l.amount)) + "</span></div>").join("");

    const own = hasOwnRates(c);
    const extras = [
      fee.couponTotal !== null && fee.couponTotal !== fee.total
        ? "Coupon carpark. A paper coupon buys a whole block however little of it you use, so " +
          "displaying them costs " + money(fee.couponTotal) + "; the Parking.sg app charges the " +
          money(fee.total) + " above."
        : "",
      // The 15-minute grace period and the peak-hour surcharge are HDB rules.
      // URA publishes neither, so neither is claimed at a URA carpark.
      !own && fee.grace
        ? "Under the 15-minute grace period at an electronic carpark, so there is nothing to pay." : "",
      !own && !fee.grace && fee.method === "electronic"
        ? "Charged by the minute, and free if you leave within 15 minutes of entering." : "",
      !own && fee.peak
        ? "One of the 12 HDB carparks with peak-hour surcharges. The daily and nightly caps do not apply here."
        : "",
      own && fee.capApplied === "window"
        ? "URA sells the whole of that period for a flat price, which is less than the half hours " +
          "would add up to, so that is what you pay."
        : "",
    ].filter(Boolean);

    feeBody =
      '<div class="fee-total"><span class="fee-n ' + f.cls + '">' + f.text + "</span>" +
        '<span class="fee-when">' + day + "<br>" + at(start) + " – " + at(end) + "</span></div>" +
      '<div class="breakdown">' + lines +
        '<div class="brow sum"><span>You pay</span><span>' + money(fee.total) + "</span></div></div>" +
      extras.map((e) => '<div class="note" style="margin:0">' + e + "</div>").join("");
  }

  $("#saved").innerHTML = "";
  $("#where").innerHTML = "";
  $("#when").innerHTML = "";
  $("#scope").hidden = true;
  $("#list").innerHTML =
    '<div class="detail">' +
      '<button class="back" id="back">← Back to the list</button>' +
      "<h2>" + tidy(c.a) + "</h2>" +
      '<div class="meta"><span>' + (TYPE_NAMES[c.t] || "Carpark") + "</span>" +
        (c.g ? '<span class="dot"></span><span>' + c.g + "m gantry</span>" : "") +
        (fee.central ? '<span class="dot"></span><span>Central Area</span>' : "") +
        (c.n ? '<span class="dot"></span><span>Night parking</span>' : "") +
        (c.c ? '<span class="dot"></span><span>Coupon</span>' : "") +
        // How many lots exist, which URA publishes and HDB does not. It is not
        // a live count and is labelled so it cannot be read as one.
        (c.k ? '<span class="dot"></span><span>' + c.k + " lots in total</span>" : "") + "</div>" +
      lots + usualLine +
      '<div class="fee-box"><div class="fee-h">Cost of this stay</div>' + feeBody + "</div>" +
      dayChartHtml(c) +
      '<a class="maps" href="https://www.google.com/maps/dir/?api=1&destination=' + c.y + "," + c.x +
        '" target="_blank" rel="noopener"><button type="button">Directions</button></a>' +
      (hasOwnRates(c)
        ? '<div class="note">Rates come from URA’s own Car Park Details service, so they are ' +
          "whatever URA currently publishes for this carpark.</div>"
        : '<div class="note">Rates are HDB’s published schedule, read on ' + R.RATES.checkedOn +
          '. <a href="' + R.RATES.source + '" target="_blank" rel="noopener">Check them yourself</a>.</div>') +
    "</div>";
  $("#back").addEventListener("click", closeDetail);

  wireHourBars($("#list"));
}

// Tapping an hour prices that arrival - which is how someone discovers that the
// answer to "when should I come" is a time they had not considered.
function wireHourBars(root) {
  root.querySelectorAll(".day-bars [data-hour]").forEach((b) => {
    b.addEventListener("click", () => {
      setStay({ start: sgDateAt(sgParts(stayStart()).date, +b.dataset.hour * 60) });
    });
  });
}

/* ---- the sheet ----------------------------------------------------- */

function setSheet(fraction) {
  const f = Math.max(0.18, Math.min(0.92, fraction));
  $("#sheet").style.setProperty("--sheet-h", (f * 100).toFixed(1) + "%");
  state.sheetFraction = f;
}

function initSheetDrag() {
  const grip = $("#grip");
  let startY = 0, startF = 0.46, dragging = false;

  grip.addEventListener("pointerdown", (e) => {
    if (!state.layoutA || window.innerWidth >= 980) return;
    dragging = true; startY = e.clientY; startF = state.sheetFraction;
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener("pointermove", (e) => {
    if (dragging) setSheet(startF + (startY - e.clientY) / window.innerHeight);
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    // No snapping. Snapping to three heights meant the sheet never came to rest
    // where it was put, and the map behind it jumped to a size nobody chose.
    // What the drag DOES have to do is tell the list where "here" now is: the
    // visible strip of map has changed, so the place the list is describing has
    // too, and leaving it stale is how you lose the spot you were looking at.
    state.centre = visibleCentre();
    state.map.invalidateSize({ pan: false });
    if (state.selected) relayoutPins(); else render();
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
}

const isWide = () => window.innerWidth >= 980;

function setLayout(which) {
  state.layoutA = which === "a";
  $("#app").dataset.layout = which;
  try { localStorage.setItem(LAYOUT_KEY, which); } catch (e) {}
  if (state.layoutA) setSheet(state.sheetFraction);
  syncChrome();
  if (state.map) setTimeout(() => { state.map.invalidateSize({ pan: false }); relayoutPins(); }, 80);
}

// The one button on the map means different things at different widths, so its
// label has to be decided in one place rather than assumed at click time.
function syncChrome() {
  const app = $("#app");
  if (!app.dataset.rail) app.dataset.rail = "on";
  const btn = $("#layoutBtn");
  if (isWide()) {
    const on = app.dataset.rail !== "off";
    btn.textContent = on ? "▣" : "▤";
    btn.title = on ? "Hide the list and use the whole window for the map" : "Show the list";
  } else {
    btn.textContent = state.layoutA ? "▤" : "▣";
    btn.title = state.layoutA ? "Switch to map above the list" : "Switch to a full-screen map";
  }
}

/* ---- the stay ------------------------------------------------------ */

// Singapore-local Y-M-D for a Date, and the reverse. The app never uses the
// browser's timezone for anything a driver sees, because a phone set to another
// zone would otherwise price the wrong half hour.
function sgParts(d) {
  const sg = new Date(d.getTime() + 8 * 3600 * 1000);
  return { date: sg.toISOString().slice(0, 10), minutes: sg.getUTCHours() * 60 + sg.getUTCMinutes() };
}
function sgDateAt(isoDate, minutes) {
  return new Date(Date.parse(isoDate + "T00:00:00Z") - 8 * 3600 * 1000 + minutes * 60000);
}
const addDays = (isoDate, k) =>
  new Date(Date.parse(isoDate + "T00:00:00Z") + k * 86400000).toISOString().slice(0, 10);

function stayEnd() {
  return new Date(stayStart().getTime() + state.stay.minutes * 60000);
}

// One place that redraws every label on the stay panel, so the readout can
// never disagree with what is actually being priced.
function paintStay() {
  const mins = state.stay.minutes;
  $("#durLabel").textContent = durationLabel(mins);
  $("#dur").value = String(Math.max(0, DURATIONS.indexOf(mins)));
  $("#durPresets").querySelectorAll("[data-mins]").forEach((b) =>
    b.setAttribute("aria-pressed", String(+b.dataset.mins === mins)));

  const later = !!state.stay.start;
  $("#whenNow").setAttribute("aria-pressed", String(!later));
  $("#whenLater").setAttribute("aria-pressed", String(later));
  $("#laterBox").hidden = !later;

  // "Arrive 11.00am, leave 1.00pm" answers the question the driver actually
  // has, which a bare duration does not.
  const start = stayStart();
  $("#startLabel").textContent = later
    ? dayAt(start) + ", " + clockAt(start) + " → " + clockAt(stayEnd())
    : clockAt(start) + " → " + clockAt(stayEnd());

  if (later) {
    const p = sgParts(start);
    const hh = String(Math.floor(p.minutes / 60)).padStart(2, "0");
    const mm = String(p.minutes % 60).padStart(2, "0");
    $("#atTime").value = hh + ":" + mm;
    $("#onDate").value = p.date;
    const today = sgParts(new Date()).date;
    $("#laterBox").querySelectorAll("[data-day]").forEach((b) =>
      b.setAttribute("aria-pressed", String(addDays(today, +b.dataset.day) === p.date)));
    $("#laterBox").querySelectorAll("[data-at]").forEach((b) =>
      b.setAttribute("aria-pressed", String(+b.dataset.at === p.minutes)));
  }
}

function setStay(patch) {
  Object.assign(state.stay, patch);
  paintStay();
  // Prices move with the stay, so the open carpark has to re-price too.
  if (state.selected) renderDetail(); else render();
}

function initStayControls() {
  $("#durPresets").innerHTML = DUR_PRESETS.map((m) =>
    '<button type="button" class="chip" data-mins="' + m + '" aria-pressed="false">' +
    durationLabel(m) + "</button>").join("");
  $("#durPresets").querySelectorAll("[data-mins]").forEach((b) => {
    // The presets live inside the slider's <label>, so a click would otherwise
    // also land on the range input and drag it.
    b.addEventListener("click", (e) => { e.preventDefault(); setStay({ minutes: +b.dataset.mins }); });
  });

  $("#dur").addEventListener("input", (e) => {
    setStay({ minutes: DURATIONS[Math.max(0, Math.min(DURATIONS.length - 1, +e.target.value))] });
  });

  $("#whenNow").addEventListener("click", () => setStay({ start: null }));
  $("#whenLater").addEventListener("click", () => {
    if (state.stay.start) return;
    // The next whole hour, in Singapore time - the answer to "later" more
    // often than any other moment.
    const p = sgParts(new Date(Date.now() + 3600000));
    setStay({ start: sgDateAt(p.date, Math.floor(p.minutes / 60) * 60) });
  });

  // A typed or picked time, to the quarter hour.
  $("#atTime").addEventListener("change", (e) => {
    const m = /^(\d{2}):(\d{2})/.exec(e.target.value || "");
    if (!m) return;
    setStay({ start: sgDateAt(sgParts(stayStart()).date, +m[1] * 60 + +m[2]) });
  });

  // "In an hour" is how people answer this, so it should not need arithmetic.
  $("#laterBox").querySelectorAll("[data-in]").forEach((b) => {
    b.addEventListener("click", () => {
      const at = new Date(Date.now() + +b.dataset.in * 60000);
      const p = sgParts(at);
      setStay({ start: sgDateAt(p.date, Math.round(p.minutes / 15) * 15) });
    });
  });

  $("#laterBox").querySelectorAll("[data-at]").forEach((b) => {
    b.addEventListener("click", () => {
      setStay({ start: sgDateAt(sgParts(stayStart()).date, +b.dataset.at) });
    });
  });

  $("#laterBox").querySelectorAll("[data-day]").forEach((b) => {
    b.addEventListener("click", () => {
      const p = sgParts(stayStart());
      setStay({ start: sgDateAt(addDays(sgParts(new Date()).date, +b.dataset.day), p.minutes) });
    });
  });

  $("#onDate").addEventListener("change", (e) => {
    if (!e.target.value) return;
    setStay({ start: sgDateAt(e.target.value, sgParts(stayStart()).minutes) });
  });

  paintStay();
}

/* ---- controls ------------------------------------------------------ */

function initControls() {
  const seg = $("#sortSeg");
  const types = $("#typeChips");
  seg.innerHTML = SORTS.map((s) => '<button type="button" data-sort="' + s.key +
    '" aria-pressed="' + (s.key === state.sort) + '">' + s.label + "</button>").join("");
  types.innerHTML = FILTERS.map((f) => '<button type="button" class="chip" data-type="' + f.key +
    '" aria-pressed="false">' + f.label + "</button>").join("");

  seg.querySelectorAll("[data-sort]").forEach((b) => {
    b.addEventListener("click", () => {
      state.sort = b.dataset.sort;
      seg.querySelectorAll("[data-sort]").forEach((o) =>
        o.setAttribute("aria-pressed", String(o.dataset.sort === state.sort)));
      closeDetail();
    });
  });

  types.querySelectorAll("[data-type]").forEach((b) => {
    b.addEventListener("click", () => {
      const t = b.dataset.type;
      if (state.types.has(t)) state.types.delete(t); else state.types.add(t);
      b.setAttribute("aria-pressed", state.types.has(t) ? "true" : "false");
      closeDetail();
    });
  });

  initStayControls();

  $("#layoutBtn").addEventListener("click", () => {
    // On a wide screen the two stacked layouts are meaningless - the rail is
    // already beside the map - so the button gives the map the whole window
    // instead of shuffling a sheet that is not there.
    if (isWide()) {
      $("#app").dataset.rail = $("#app").dataset.rail === "off" ? "on" : "off";
      syncChrome();
      setTimeout(() => {
        state.map.invalidateSize({ pan: false });
        state.centre = visibleCentre();
        if (state.selected) relayoutPins(); else render();
      }, 60);
      return;
    }
    setLayout(state.layoutA ? "b" : "a");
  });

  $("#locate").addEventListener("click", async () => {
    const btn = $("#locate");

    // The browser only shows its permission prompt the FIRST time, and never
    // again once the answer is remembered. So a click that appears to do
    // nothing usually means the answer is already "block" - and saying that is
    // far more use than a generic "could not get your location".
    if (!navigator.geolocation) {
      return notice("This browser cannot share your location.",
        "Search for a place, road or postcode instead.", "bad");
    }
    if (!window.isSecureContext) {
      return notice("Location needs a secure connection.",
        "Open the site over https and try again.", "bad");
    }
    if (navigator.permissions && navigator.permissions.query) {
      try {
        const st = await navigator.permissions.query({ name: "geolocation" });
        if (st.state === "denied") {
          return notice("Location is blocked for this site.",
            "Your browser will not ask again until you allow it: click the padlock or the " +
            "location icon in the address bar, set Location to Allow, then reload.", "bad");
        }
      } catch (e) { /* not supported here; fall through and just ask */ }
    }

    btn.disabled = true;
    btn.setAttribute("aria-busy", "true");
    notice("Finding you\u2026", "Your browser may ask for permission.", "busy");
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(
          (p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
          rej, { enableHighAccuracy: true, timeout: 15000 }));
      state.me = pos;
      if (state.meMarker) state.map.removeLayer(state.meMarker);
      state.meMarker = L.marker([pos.lat, pos.lng], {
        icon: L.divIcon({ className: "pin-icon", html: '<div class="me-dot"></div>', iconSize: [0, 0] }),
        keyboard: false, zIndexOffset: -1000,
      }).addTo(state.map);
      clearNotice();
      // goTo, not setView: on a phone the sheet covers the bottom of the map,
      // and centring on it puts you behind the list.
      goTo(pos.lat, pos.lng, 17);
    } catch (e) {
      const code = e && e.code;
      if (code === 1) {
        notice("You turned down the location request.",
          "Allow it from the address bar if you change your mind, or search for a place.", "bad");
      } else if (code === 3) {
        notice("Your location took too long to arrive.",
          "This is common indoors. Try again, or search for a place.", "bad");
      } else {
        notice("Your device could not work out where it is.",
          "Try again in a moment, or search for a place, road or postcode.", "bad");
      }
    } finally {
      btn.disabled = false;
      btn.removeAttribute("aria-busy");
    }
  });
}

// Messages live in their own element, not in the list. render() rewrites the
// list on every map move, so an error written there vanishes the moment the map
// settles - which is the moment the reader goes looking for it.
function notice(title, detail, kind) {
  const box = $("#notice");
  box.className = kind || "";
  box.innerHTML = "<p><b>" + title + "</b>" + (detail ? "<small>" + detail + "</small>" : "") + "</p>" +
    (kind === "busy" ? "" : '<button type="button" aria-label="Dismiss">\u00d7</button>');
  box.hidden = false;
  const x = box.querySelector("button");
  if (x) x.addEventListener("click", clearNotice);
}

function clearNotice() {
  const box = $("#notice");
  box.hidden = true;
  box.innerHTML = "";
  box.className = "";
}

function fail(message) {
  $("#where").innerHTML = "";
  notice(message, "", "bad");
}

// Centre the map on a place. In layout A the sheet covers the bottom of the
// map, so the place is nudged up into the visible strip - otherwise the thing
// you just searched for lands behind the list.
function goTo(lat, lng, zoom) {
  state.selected = null;
  closeSuggestions();
  if (!$("#notice").classList.contains("busy")) clearNotice();
  state.map.setView([lat, lng], zoom || 17, { animate: false });
  const hidden = hiddenMapPixels();
  if (hidden > 0) state.map.panBy([0, hidden / 2], { animate: false });
  state.centre = { lat: lat, lng: lng };
  render();
}

// A road is an area, not a point. Orchard Road is two kilometres long, so
// dropping someone at zoom 17 shows one shopfront of it - no use at all to
// "I am going to Orchard, where is parking cheap?".
const zoomFor = (r) => (isRoad(r) ? 16 : 17);

// More than one place matches, and the ranking cannot be trusted - so ask
// rather than guess. Showing the road name is what distinguishes "Jurong Point"
// the mall from a clinic that happens to share two words with it.
function offerChoices(results) {
  $("#saved").innerHTML = "";
  $("#scope").hidden = true;
  $("#where").innerHTML = "Which one did you mean?";
  $("#list").innerHTML = results.map((r, i) =>
    '<button class="row choice" data-i="' + i + '"><strong>' + r.SEARCHVAL + "</strong>" +
      '<span class="meta">' + [r.ROAD_NAME, r.POSTAL !== "NIL" ? "S" + r.POSTAL : ""]
        .filter((x) => x && x !== "NIL").join(" · ") + "</span></button>").join("");
  $("#list").querySelectorAll(".choice").forEach((b) => {
    b.addEventListener("click", () => {
      const r = results[+b.dataset.i];
      goTo(parseFloat(r.LATITUDE), parseFloat(r.LONGITUDE), zoomFor(r));
    });
  });
}

// Destination search, via OneMap - the government's own geocoder, CORS-open and
// no key required. Geolocation only helps once you have arrived; planning a
// trip means asking about somewhere you are not.
//
// Suggestions rather than a bare submit, because OneMap's own ranking cannot be
// trusted: "Jurong Point" returns a CLINIC IN TAMAN JURONG first, kilometres
// from the mall, with the mall itself third. Offering the candidates with their
// road names lets the person who knows which one they meant say so - and it is
// what makes a vague area search work too, since the road itself is one of the
// answers on offer.
const suggest = { items: [], active: -1, seq: 0, timer: null };

// OneMap answers 429 when asked too often, and its error page is HTML, so a
// reply that is not JSON has to fail as "unavailable" and not as a crash. The
// cache is here for the same reason: backspacing a word should not re-ask.
const placeCache = new Map();

async function fetchPlaces(text) {
  const key = text.toLowerCase();
  if (placeCache.has(key)) return placeCache.get(key);
  const url = "https://www.onemap.gov.sg/api/common/elastic/search?searchVal=" +
    encodeURIComponent(text) + "&returnGeom=Y&getAddrDetails=Y&pageNum=1";
  const res = await fetch(url);
  if (!res.ok) throw new Error("onemap " + res.status);
  const j = await res.json();
  const out = rankPlaces((j.results || []).filter((r) => r.LATITUDE && r.LONGITUDE), text);
  if (placeCache.size > 60) placeCache.clear();
  placeCache.set(key, out);
  return out;
}

// A road IS a place to park near, and OneMap does not treat it as one: asked
// for "orchard road" it answers with a HOTEL ON BIDEFORD ROAD first and puts
// Orchard Road itself second. Someone who typed the name of a road wants the
// road, so an exact name match is floated to the top - the same preference the
// submit path has always applied, just made visible in the list.
function isRoad(r) {
  const name = String(r.SEARCHVAL || "").trim().toUpperCase();
  return !!name && name === String(r.ROAD_NAME || "").trim().toUpperCase();
}

function rankPlaces(results, text) {
  const wanted = text.trim().toUpperCase();
  const score = (r) => {
    const name = String(r.SEARCHVAL || "").trim().toUpperCase();

    if (name === wanted) return isRoad(r) ? 0 : 1;
    return isRoad(r) && name.indexOf(wanted) === 0 ? 2 : 3;
  };
  return results
    .map((r, i) => ({ r: r, s: score(r), i: i }))
    .sort((a, b) => a.s - b.s || a.i - b.i)
    .map((x) => x.r);
}

// What distinguishes one hit from another. "Road" is called out because it is
// the answer to a different question - park anywhere along here, rather than at
// this exact door - and the map zooms out for it.
const placeSub = (r) => (isRoad(r)
  ? ["Road \u00b7 park anywhere along it"]
  : [r.BLK_NO && r.BLK_NO !== "NIL" ? "Blk " + r.BLK_NO : "", r.ROAD_NAME,
     r.POSTAL && r.POSTAL !== "NIL" ? "S" + r.POSTAL : ""]
).filter((x) => x && x !== "NIL").join(" \u00b7 ");

function closeSuggestions() {
  suggest.items = [];
  suggest.active = -1;
  const box = $("#sugg");
  box.hidden = true;
  box.innerHTML = "";
  $("#q").setAttribute("aria-expanded", "false");
}

function paintSuggestions(note) {
  const box = $("#sugg");
  if (!suggest.items.length && !note) return closeSuggestions();
  box.innerHTML = note
    ? '<li class="hint">' + note + "</li>"
    : suggest.items.map((r, i) =>
        '<li role="option" data-i="' + i + '" aria-selected="' + (i === suggest.active) + '">' +
        "<b>" + r.SEARCHVAL + "</b><span>" + placeSub(r) + "</span></li>").join("");
  box.hidden = false;
  $("#q").setAttribute("aria-expanded", "true");
  box.querySelectorAll("[data-i]").forEach((li) => {
    // pointerdown, not click: the input's blur would close the list first.
    li.addEventListener("pointerdown", (e) => { e.preventDefault(); pickPlace(+li.dataset.i); });
  });
}

function pickPlace(i) {
  const r = suggest.items[i];
  if (!r) return;
  $("#q").value = r.SEARCHVAL;
  $("#q").blur();
  goTo(parseFloat(r.LATITUDE), parseFloat(r.LONGITUDE), zoomFor(r));
}

function initSearch() {
  const q = $("#q");

  q.addEventListener("input", () => {
    clearTimeout(suggest.timer);
    const text = q.value.trim();
    if (text.length < 2) return closeSuggestions();
    // Debounced, and stamped: a slow reply for "orch" must never overwrite the
    // list already showing for "orchard road".
    suggest.timer = setTimeout(async () => {
      const seq = ++suggest.seq;
      try {
        const results = await fetchPlaces(text);
        if (seq !== suggest.seq) return;
        suggest.items = results.slice(0, 7);
        suggest.active = -1;
        paintSuggestions(results.length ? null : "Nothing found for \u201c" + text + "\u201d");
      } catch (e) {
        if (seq === suggest.seq) paintSuggestions("Search is unavailable right now");
      }
    }, 300);
  });

  q.addEventListener("keydown", (e) => {
    if ($("#sugg").hidden || !suggest.items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const last = suggest.items.length - 1;
      if (e.key === "ArrowDown") suggest.active = suggest.active >= last ? 0 : suggest.active + 1;
      else suggest.active = suggest.active <= 0 ? last : suggest.active - 1;
      paintSuggestions();
    } else if (e.key === "Enter" && suggest.active >= 0) {
      e.preventDefault();
      pickPlace(suggest.active);
    } else if (e.key === "Escape") {
      closeSuggestions();
    }
  });

  q.addEventListener("blur", () => setTimeout(closeSuggestions, 120));

  $("#searchForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = q.value.trim();
    if (!text) return;
    if (suggest.active >= 0) return pickPlace(suggest.active);
    const go = $("#go");
    go.disabled = true;
    try {
      const results = await fetchPlaces(text);
      if (!results.length) {
        fail("Nothing found for \u201c" + text + "\u201d. Try a block number, road, building name or postal code.");
        return;
      }
      const exact = results.find((r) => r.SEARCHVAL.trim().toUpperCase() === text.toUpperCase());
      const one = exact || (results.length === 1 ? results[0] : null);
      if (one) goTo(parseFloat(one.LATITUDE), parseFloat(one.LONGITUDE), zoomFor(one));
      else offerChoices(results.slice(0, 6));
    } catch (err) {
      fail("Search is unavailable right now. Try again in a moment.");
    } finally {
      go.disabled = false;
      closeSuggestions();
    }
  });
}

/* ---- start --------------------------------------------------------- */

(async function start() {
  let saved = "a";
  try { saved = localStorage.getItem(LAYOUT_KEY) || "a"; } catch (e) {}
  setLayout(saved === "b" ? "b" : "a");
  initSheetDrag();
  initControls();
  initSearch();
  initMap();

  // Crossing 980px swaps a drawer for a rail, which changes how much map is
  // visible and therefore what "near here" means.
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      syncChrome();
      if (!state.map) return;
      state.map.invalidateSize({ pan: false });
      state.centre = visibleCentre();
      if (state.selected) relayoutPins(); else render();
    }, 150);
  });

  try {
    await loadStatic();
  } catch (e) {
    fail("Could not load the carpark list. Check your connection and reload.");
    return;
  }
  // Live lots are a bonus, not a prerequisite: the map, the fees and the
  // opening hours are all useful with no signal at all.
  try { await loadLive(); } catch (e) {}
  render();
})();

// Offline support. The manifest already claims this is an installable app, so
// it should survive a lift-lobby dead spot: the shell and the carpark list are
// cached, while live availability is always fetched fresh and simply absent
// when there is no signal. A stale lot count would be worse than none.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>

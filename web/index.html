<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Carpark SG — live HDB carpark availability</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #14181f; --muted: #5c6672; --line: #e3e7ec;
    --ok: #17794a; --warn: #9a6200; --bad: #b3261e; --accent: #14181f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --card: #171d24; --ink: #e8edf2; --muted: #94a1ae; --line: #262f39;
      --ok: #4ac48a; --warn: #e0a33a; --bad: #ef6b62; --accent: #e8edf2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding: 20px 16px 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main { padding: 0 16px 40px; max-width: 640px; margin: 0 auto; }
  button {
    font: inherit; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; width: 100%;
  }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .row {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 10px;
  }
  .row h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
  .lots { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
  .n { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .of { color: var(--muted); font-size: 13px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; border-radius: 3px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag {
    font-size: 12px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .tag.free { color: var(--ok); border-color: currentColor; font-weight: 600; }
  .tag.stale { color: var(--warn); border-color: currentColor; }
  .note {
    font-size: 13px; color: var(--muted); border: 1px dashed var(--line);
    border-radius: 10px; padding: 12px; margin: 14px 0;
  }
  .err { color: var(--bad); }
  .or {
    text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 8px;
  }
  #searchForm { display: flex; gap: 8px; }
  #q {
    flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #go { width: auto; flex: 0 0 auto; }
  .where { font-size: 13px; color: var(--muted); margin: 14px 0 8px; }
  .where strong { color: var(--ink); }
  .choice {
    text-align: left; margin-bottom: 8px; display: flex; flex-direction: column;
    align-items: flex-start; gap: 2px;
  }
  .choice strong { font-weight: 600; }
  .choice .meta { font-size: 13px; }
  .row { position: relative; }
  .star {
    position: absolute; top: 8px; right: 8px; width: auto; padding: 4px 8px;
    border: none; background: none; font-size: 20px; line-height: 1;
    color: var(--muted); cursor: pointer;
  }
  .star.on { color: #e0a33a; }
  .row h2 { padding-right: 36px; }
</style>
</head>
<body>
<header>
  <h1>Carpark SG</h1>
  <div class="sub" id="sub">HDB carparks, live availability</div>
</header>
<main>
  <div id="action">
    <button class="primary" id="locate">Find carparks near me</button>
    <div class="or">or search a destination</div>
    <form id="searchForm" autocomplete="off">
      <input id="q" type="search" placeholder="Jurong Point, Blk 123 Ang Mo Kio, Changi Airport…"
             aria-label="Search for a destination">
      <button type="submit" id="go">Search</button>
    </form>
  </div>
  <div class="note" id="scope">
    <strong>HDB carparks only.</strong> Shopping-mall and URA carparks are not included yet, so an
    empty list here does not mean there is no parking nearby.
  </div>
  <div id="saved"></div>
  <div class="where" id="where"></div>
  <div id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const state = { carparks: null, windows: [], holidays: [], patterns: {}, live: null, fetchedAt: null, lastPos: null };

// Straight-line distance. Labelled as such in the UI - real walking distance
// needs routing we deliberately do not do.
function haversine(aLat, aLng, bLat, bLng) {
  const R = 6371000, toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(bLat - aLat), dLng = toRad(bLng - aLng);
  const s = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

const DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

// Mirrors src/quality.js. A large carpark reporting EVERY lot free is almost
// certainly a carpark whose sensors are offline, not an empty one: in a single
// snapshot 36 carparks reported 100% free, including one with 2,754 lots.
// Below 50 lots an empty carpark is entirely believable, so those are left
// alone - crying wolf there teaches people to ignore the warning.
function looksUnreported(total, available) {
  if (!total || available === null || available === undefined) return false;
  return available === total && total >= 50;
}

// Mirrors src/windows.js. A window we cannot read means NOT free: telling
// someone parking is free when it is not is the one error that costs them money.
function isFreeNow(windows, now) {
  if (!windows || !windows.length) return false;
  const sg = new Date(now.getTime() + 8 * 3600 * 1000);
  const day = DAYS[sg.getUTCDay()];
  const iso = sg.toISOString().slice(0, 10);
  const isPH = state.holidays.includes(iso);
  const mins = sg.getUTCHours() * 60 + sg.getUTCMinutes();
  return windows.some((w) =>
    (w.days.includes("ALL") || w.days.includes(day) || (isPH && w.days.includes("PH"))) &&
    mins >= w.from && mins < w.to
  );
}

// Mirrors src/patterns.js. Three day types by 24 hours: an HDB carpark is
// packed overnight and empty at 10am on a WEEKDAY, and still packed at 10am on
// a Sunday. A public holiday behaves like a Sunday, not like the Tuesday it
// happens to fall on.
function bucketFor(now, isPH) {
  const sg = new Date(now.getTime() + 8 * 3600 * 1000);
  const dow = sg.getUTCDay();
  const type = isPH || dow === 0 ? 2 : dow === 6 ? 1 : 0;
  return type * 24 + sg.getUTCHours();
}

function typicalNow(id, now) {
  const p = state.patterns[id];
  if (!p) return null;
  const iso = new Date(now.getTime() + 8 * 3600 * 1000).toISOString().slice(0, 10);
  const ch = p[bucketFor(now, state.holidays.includes(iso))];
  if (!ch || ch === "-") return null;
  return Number(ch) / 9;
}

async function loadStatic() {
  const [c, h, p] = await Promise.all([
    fetch("carparks.min.json").then((r) => r.json()),
    fetch("holidays.json").then((r) => r.json()).catch(() => []),
    // Patterns are built from history we collect ourselves, so this file is
    // legitimately empty for the first couple of weeks. Absent or empty must
    // both simply mean "no prediction", never an error.
    fetch("patterns.json").then((r) => r.json()).catch(() => ({ data: {} })),
  ]);
  state.carparks = c.carparks;
  state.windows = c.windows;
  state.holidays = h;
  state.patterns = (p && p.data) || {};
}

// Fetched straight from data.gov.sg: the API sends Access-Control-Allow-Origin: *,
// so no server of our own sits in the middle.
async function loadLive() {
  const r = await fetch("https://api.data.gov.sg/v1/transport/carpark-availability");
  const j = await r.json();
  const map = new Map();
  for (const c of (j.items?.[0]?.carpark_data) || []) {
    const car = (c.carpark_info || []).find((i) => i.lot_type === "C") || c.carpark_info?.[0];
    if (!car) continue;
    const total = parseInt(car.total_lots, 10);
    map.set("hdb:" + c.carpark_number.trim().toUpperCase(), {
      // A reported total of 0 means NOT REPORTING, not full. Showing it as full
      // would send people away from a carpark that has space.
      total: total > 0 ? total : null,
      available: total > 0 ? parseInt(car.lots_available, 10) : null,
      at: c.update_datetime ? new Date(c.update_datetime + "+08:00") : null,
    });
  }
  state.live = map;
  state.fetchedAt = new Date();
}

function tidy(address) {
  return address.replace(/\bBLK\b/g, "Blk").replace(/\s+/g, " ")
    .toLowerCase().replace(/\b[a-z]/g, (m) => m.toUpperCase());
}

// Saved carparks live in this browser only. There is no account and no server,
// so there is nothing to lose or leak - and nothing to sync either, which is
// stated in the UI rather than left for someone to discover on a second device.
const SAVED_KEY = "carpark-sg:saved";

function loadSaved() {
  try {
    return JSON.parse(localStorage.getItem(SAVED_KEY)) || [];
  } catch (e) {
    // Private browsing and blocked site data both throw here. Favourites are a
    // convenience; losing them must never stop the app working.
    return [];
  }
}

function toggleSaved(id) {
  const saved = loadSaved();
  const next = saved.includes(id) ? saved.filter((x) => x !== id) : saved.concat(id);
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(next)); } catch (e) {}
  return next;
}

function card(c, distance) {
  const now = new Date();
  const live = state.live?.get(c.i);
  const free = isFreeNow(state.windows[c.f], now);
  const ageMin = live?.at ? Math.round((now - live.at) / 60000) : null;
  const stale = ageMin !== null && ageMin > 15;
  const isSaved = loadSaved().includes(c.i);

  let lots = '<div class="meta">No live data for this carpark</div>';
  const suspect = live && looksUnreported(live.total, live.available);
  if (live && live.total !== null) {
    const pct = Math.max(0, Math.min(1, live.available / live.total));
    const colour = pct > 0.2 ? "var(--ok)" : pct > 0.05 ? "var(--warn)" : "var(--bad)";
    lots =
      '<div class="lots"><span class="n" style="color:' + colour + '">' + live.available +
      '</span><span class="of">of ' + live.total + ' lots free</span></div>' +
      '<div class="bar"><i style="width:' + (pct * 100).toFixed(0) + '%;background:' + colour + '"></i></div>';
  } else if (live) {
    lots = '<div class="meta">Not reporting lot counts right now</div>';
  }

  // "12 lots free" means little on its own. "12 free, usually about 40% free at
  // this hour" tells you whether you have been lucky or whether this is a
  // carpark to avoid at 7pm. Only shown once a bucket has enough readings; the
  // rest of the time the app stays quiet rather than guessing.
  const usual = typicalNow(c.i, now);
  let usualTag = "";
  if (usual !== null) {
    usualTag = '<span class="tag">Usually ' + Math.round(usual * 100) + "% free now</span>";
    if (live && live.total) {
      const nowRate = live.available / live.total;
      const gap = nowRate - usual;
      if (gap <= -0.15) usualTag += '<span class="tag stale">Busier than usual</span>';
      else if (gap >= 0.15) usualTag += '<span class="tag free">Quieter than usual</span>';
    }
  }

  const tags = [
    free ? '<span class="tag free">Free right now</span>' : "",
    usualTag,
    suspect ? '<span class="tag stale">Reports every lot free - sensors may be down</span>' : "",
    stale ? '<span class="tag stale">Updated ' + ageMin + ' min ago</span>' : "",
    c.g ? '<span class="tag">' + c.g + "m gantry</span>" : "",
  ].filter(Boolean).join("");

  const where = distance === null ? "" :
    '<div class="meta"><span>' +
    (distance < 1000 ? Math.round(distance) + " m" : (distance / 1000).toFixed(1) + " km") +
    " away (straight line)</span></div>";

  return '<div class="row">' +
    '<button class="star' + (isSaved ? " on" : "") + '" data-id="' + c.i + '" ' +
      'aria-label="' + (isSaved ? "Remove from saved" : "Save this carpark") + '" ' +
      'title="' + (isSaved ? "Remove from saved" : "Save this carpark") + '">' +
      (isSaved ? "★" : "☆") + "</button>" +
    "<h2>" + tidy(c.a) + "</h2>" + where + lots +
    (tags ? '<div class="tags">' + tags + "</div>" : "") + "</div>";
}

function wireStars(root) {
  root.querySelectorAll(".star").forEach((b) => {
    b.addEventListener("click", () => {
      toggleSaved(b.dataset.id);
      if (state.lastPos) render(state.lastPos);
    });
  });
}

function render(pos) {
  state.lastPos = pos;
  const byId = new Map(state.carparks.map((c) => [c.i, c]));
  const saved = loadSaved().map((id) => byId.get(id)).filter(Boolean);

  // Saved carparks get a distance too. A favourite 8km away is still worth
  // knowing about, but only if the page says so - otherwise the card looks like
  // it is nearby.
  $("#saved").innerHTML = saved.length
    ? '<div class="where">Saved</div>' +
      saved.map((c) => card(c, haversine(pos.lat, pos.lng, c.y, c.x))).join("")
    : "";

  const near = state.carparks
    .map((c) => ({ c, d: haversine(pos.lat, pos.lng, c.y, c.x) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, 15);

  $("#list").innerHTML = near.map(({ c, d }) => card(c, d)).join("");
  wireStars($("#list"));
  wireStars($("#saved"));

  $("#sub").textContent = "Live as of " + state.fetchedAt.toLocaleTimeString("en-SG",
    { hour: "2-digit", minute: "2-digit" }) + " · " + state.carparks.length.toLocaleString() + " HDB carparks";
}

async function showFor(pos, label) {
  if (!state.carparks) await loadStatic();
  await loadLive();
  render(pos);
  $("#where").innerHTML = "Nearest carparks to <strong>" + label + "</strong>";
}

function fail(message) {
  $("#where").innerHTML = "";
  $("#list").innerHTML = '<div class="note err">' + message + "</div>";
}

async function pick(result) {
  await showFor(
    { lat: parseFloat(result.LATITUDE), lng: parseFloat(result.LONGITUDE) },
    result.SEARCHVAL
  );
}

// More than one place matches, and the ranking cannot be trusted - so ask
// rather than guess. Showing the road name is what distinguishes "Jurong Point"
// the mall from a clinic that happens to share two words with it.
function offerChoices(results) {
  $("#where").innerHTML = "Which one did you mean?";
  $("#list").innerHTML = results.map((r, i) =>
    '<button class="choice" data-i="' + i + '">' +
      "<strong>" + r.SEARCHVAL + "</strong>" +
      '<span class="meta">' + [r.ROAD_NAME, r.POSTAL !== "NIL" ? "S" + r.POSTAL : ""]
        .filter((x) => x && x !== "NIL").join(" · ") + "</span>" +
    "</button>"
  ).join("");
  $("#list").querySelectorAll(".choice").forEach((b) => {
    b.addEventListener("click", () => pick(results[+b.dataset.i]));
  });
}

$("#locate").addEventListener("click", async () => {
  const btn = $("#locate");
  btn.disabled = true;
  btn.textContent = "Locating…";
  try {
    const pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(
        (p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
        rej, { enableHighAccuracy: true, timeout: 15000 }
      ));
    btn.textContent = "Loading carparks…";
    await showFor(pos, "your location");
  } catch (e) {
    fail("Could not get your location or the live data. Check location permission, " +
      "or search for a destination instead.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Find carparks near me";
  }
});

// Destination search, via OneMap - the government's own geocoder, CORS-open and
// no key required. Geolocation only helps once you have arrived; planning a
// trip means asking about somewhere you are not.
$("#searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  const go = $("#go");
  go.disabled = true;
  go.textContent = "…";
  try {
    const url = "https://www.onemap.gov.sg/api/common/elastic/search?searchVal=" +
      encodeURIComponent(q) + "&returnGeom=Y&getAddrDetails=Y&pageNum=1";
    const j = await fetch(url).then((r) => r.json());
    const results = j.results || [];
    if (!results.length) {
      fail("Nothing found for “" + q + "”. Try a block number, building name or postal code.");
      return;
    }

    // OneMap's own ranking is not reliable enough to pick from blindly:
    // searching "Jurong Point" returns a CLINIC IN TAMAN JURONG first, several
    // kilometres from the mall, with the mall itself third. Silently taking the
    // top hit would show carparks near somewhere the user never asked about,
    // and the list would look perfectly plausible.
    const exact = results.find((r) => r.SEARCHVAL.trim().toUpperCase() === q.toUpperCase());
    if (exact) {
      await pick(exact);
    } else if (results.length === 1) {
      await pick(results[0]);
    } else {
      offerChoices(results.slice(0, 6));
    }
  } catch (err) {
    fail("Search is unavailable right now. Try again in a moment.");
  } finally {
    go.disabled = false;
    go.textContent = "Search";
  }
});

// Offline support. The manifest already claims this is an installable app, so
// it should survive a lift-lobby dead spot: the shell and the carpark list are
// cached, while live availability is always fetched fresh and simply absent
// when there is no signal. A stale lot count would be worse than none.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
